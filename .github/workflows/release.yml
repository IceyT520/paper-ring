name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    working-directory: website

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: |
          node -e "const v=require('./package.json').version;const t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(v!==t){console.error('package.json '+v+' does not match tag '+process.env.GITHUB_REF_NAME);process.exit(1)}"
      - run: pnpm test
      - run: pnpm release
      # GitHub sanitises non-ASCII asset names to "default.<ext>", so publish
      # ASCII copies under the version; the Chinese names stay in the repo.
      - name: Stage release assets
        working-directory: .
        run: |
          mkdir -p release-assets/share
          cp 纸环的两面.html "release-assets/paper-ring-${GITHUB_REF_NAME}.html"
          cp 纸环的两面.pdf "release-assets/paper-ring-${GITHUB_REF_NAME}.pdf"
          # A shareable folder: the single file, the article and the soundtrack
          # side by side, so offline copies keep their music.
          cp 纸环的两面.html release-assets/share/
          cp 纸环的两面.pdf release-assets/share/
          cp theme.mp3 release-assets/share/
          printf '把这三份放在同一个文件夹里，双击「纸环的两面.html」——拆开信封后音乐就会响。\n' > "release-assets/share/使用说明.txt"
          (cd release-assets/share && zip -q -r "../paper-ring-${GITHUB_REF_NAME}-share.zip" .)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/paper-ring-*.html
            release-assets/paper-ring-*.pdf
            release-assets/paper-ring-*-share.zip
