name: Deploy exhibition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # The shipped single file is rebuilt here so the browser checks test the
      # artefact a reader actually opens, not the dev server.
      - run: pnpm package
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/qa-offline.mjs
        env:
          PAPER_BROWSER: chromium
      - run: node scripts/qa-alignment.mjs --offline
        env:
          PAPER_BROWSER: chromium
      - run: pnpm check:content
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
